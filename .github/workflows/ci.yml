name: CI

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    uses: ./.github/workflows/tests.yml
    with:
      suite: unit

  schema:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    uses: ./.github/workflows/tests.yml
    with:
      suite: integration

  external:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tests.yml
    with:
      suite: external
